services:
  - type: web
    name: mindyourmoney-back
    env: node
    buildCommand: npm install && npm run build
    startCommand: node dist/main/app.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        generateValue: false
      - key: DB_TYPE
        sync: false
      - key: DB_URL
        sync: false
      - key: JWT_SECRET
        sync: false
